
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA - Administrador</title>
    <link rel="stylesheet" href="estilo_de_logins.css">
</head>

<body>

    <header class="encabezado-admin">

        <img src="images.jpg alt="Logo ALPHA>

        <p>SISTEMA DE GESTIÓN EDUCATIVA</p>

    </header>

    <main class="contenido-admin">

        <div class="tarjeta-admin">

            <div class="etiqueta-admin">
                ACCESO ADMINISTRATIVO
            </div>

            <h1>BIENVENIDO</h1>

            <p class="descripcion-admin">
                Ingresa tus credenciales para acceder
                al panel de administración de ALPHA.
            </p>

            <form>

                <label for="usuario">USUARIO</label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Correo institucional"
                >

                <label for="contrasena">CONTRASEÑA</label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Ingresa tu contraseña"
                >

                <button type="submit">
                    INICIAR SESIÓN
                </button>

            </form>

            <p class="mensaje-seguridad">
                ACCESO PARA ADMINISTRADORES
            </p>

        </div>

    </main>

    <footer class="pie-admin">

        <p>ALPHA © 2026 | SISTEMA DE GESTIÓN DE ALFABETIZACIÓN</p>

    </footer>

</body>
</html>
