
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Administrador</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>ALPHA</h1>
        <h2>Inicio de sesión - Administrador</h2>
    </header>

    <main>
        <div class="tarjeta-ingreso">

            <h2>ADMINISTRADOR</h2>
            <p>Ingresa tus datos para acceder al sistema</p>

            <form>

                <label for="Usuario">Usuario</label>
                <input type="text" id="Usuario" name="usuario" placeholder="Correo institucional">

                <label for="Contraseña">Contraseña</label>
                <input type="password" id="Contraseña" name="contraseña" placeholder="Ingresa tu contraseña">

                <button type="submit">Iniciar sesión</button>

            </form>

          

        </div>
    </main>

    <footer>
        <p>© 2026 ALPHA - Sistema de gestión</p>
    </footer>

</body>
</html>
