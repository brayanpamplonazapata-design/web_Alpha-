
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ALPHA - Login Estudiante</title>
    <link rel="stylesheet" href="estilo_de_logins.css">
</head>
<body>

    <header class="encabezado-estudiante">

        <h1>ALPHA</h1>
        <p>Portal del estudiante</p>

    </header>

    <main class="contenido-estudiante">

        <div class="tarjeta-estudiante">

            <div class="icono-estudiante">
                <span>ESTUDIANTE</span>
            </div>

            <h2>¡Bienvenido!</h2>

            <p class="descripcion-estudiante">
                Ingresa a tu cuenta para consultar tu progreso
                y tus horas de alfabetización.
            </p>

            <form>

                <label for="usuario-estudiante">Correo institucional</label>

                <input
                    type="email"
                    id="usuario-estudiante"
                    name="usuario"
                    placeholder="Ingresa tu correo institucional"
                >

                <label for="contrasena-estudiante">Contraseña</label>

                <input
                    type="password"
                    id="contrasena-estudiante"
                    name="contrasena"
                    placeholder="Ingresa tu contraseña"
                >

              

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p class="ayuda-estudiante">
                ¿Problemas para ingresar? Contacta al administrador.
            </p>

        </div>

    </main>

    <footer class="pie-estudiante">

        <p>ALPHA © 2026 - Sistema de gestión de alfabetización</p>

    </footer>

</body>
</html>
